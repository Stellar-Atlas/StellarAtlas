[Unit]
# network-online alone does not guarantee that libvirt has created virbr0.
Wants=network-online.target libvirtd.service
After=network-online.target libvirtd.service

[Service]
# Keep the private bind address. Wait before opening RPC/Core databases.
# A missing bridge fails this attempt after five minutes; Restart retries later.
ExecStartPre=/usr/bin/timeout --verbose 300s /bin/sh -c 'echo "Waiting up to 300s for RPC private address 192.168.122.1 on virbr0" >&2; until /usr/sbin/ip -4 -o address show dev virbr0 2>/dev/null | /usr/bin/grep -q " inet 192[.]168[.]122[.]1/"; do /usr/bin/sleep 2; done; echo "RPC private bridge address is ready" >&2'
TimeoutStartSec=330s
# At most four attempts per existing 120s/6-start window, even on quick failures.
RestartSec=30s
