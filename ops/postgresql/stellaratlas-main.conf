# StellarAtlas primary database profile for the 48-vCPU, 123-GiB VM.
# Keep enough RAM and CPU available for archive workers, ETL, Horizon, and RPC.

max_connections = 300

shared_buffers = '24GB'
effective_cache_size = '72GB'
work_mem = '8MB'
maintenance_work_mem = '4GB'
autovacuum_work_mem = '512MB'
huge_pages = try

max_worker_processes = 64
max_parallel_workers = 24
max_parallel_workers_per_gather = 6
max_parallel_maintenance_workers = 4

effective_io_concurrency = 64
maintenance_io_concurrency = 64
random_page_cost = 1.5
default_statistics_target = 200
jit = off

autovacuum_max_workers = 12
autovacuum_naptime = '10s'
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.02
autovacuum_vacuum_cost_delay = '2ms'
autovacuum_vacuum_cost_limit = 4000
vacuum_buffer_usage_limit = '64MB'

checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
min_wal_size = '8GB'
max_wal_size = '32GB'
wal_compression = on

bgwriter_delay = '100ms'
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0

track_io_timing = on
track_wal_io_timing = on
log_lock_waits = on
log_autovacuum_min_duration = '5s'
log_temp_files = '256MB'
deadlock_timeout = '500ms'
idle_in_transaction_session_timeout = '5min'
